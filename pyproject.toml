[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-media"
version = "1.0.0"
description = "Professional Media Player for Windows with Full Accessibility Support"
readme = "README.md"
authors = [{name = "M S Media Player Team"}]
license = {text = "Proprietary - All rights reserved"}
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
    "python-vlc>=3.0.0",
    "platformdirs>=4.0.0",
    "yt-dlp>=2024.1.0",
    "pysrt>=1.1.2",
    "pysubs2>=1.6.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.entry-points.gui_scripts]
ms-media-player = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true